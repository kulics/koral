name: ci

# Roles: `compiler/` is the primary compiler implementation -- the one under
# development. `compiler-reference/` is the FROZEN Swift compiler, kept as the
# reference oracle, the build seed, and a backup. See "Compiler roles" in
# docs/developer-guide.md.
#
# The verification chain is fixed-order and must not be reordered -- see
# docs/bootstrap-productization-plan.md. The order is not "host first": it is
# that the seed must exist before the compiler it builds, and that the test
# harness is built by the frozen seed rather than by the implementation under
# test. Each step is a different kind of evidence:
#
#   0. build seed + harness -- the frozen Swift compiler, and the test runner
#                              built WITH it (trust boundary: if the compiler
#                              under test built the harness, a codegen defect in
#                              it would corrupt the thing meant to catch it)
#   1. seed self-check      -- the frozen seed still behaves as recorded
#   2. seed -> stage1       -- can the primary implementation still be built?
#   3. main gate            -- does that build pass? Development is gated here.
#   4. self-host + fixed point -- is it stable under its own output? (and does it
#                              emit no dangling declarations?)
#   5. stage2 suite         -- does the self-hosted compiler still pass?
#   6. differential oracle  -- do the two compilers AGREE?
#
# Step 6 is what keeps the two honest. Steps 1-5 can all be green while the two
# compilers disagree -- a self-host fixed point proves stability, not
# correctness. One-sided drift fails here even when both suites are green. The
# oracle compares behaviour (accept/reject, program stdout, exit code) and
# diagnostic text rather than generated C, because the two stamp DefIds into
# symbol names under different numbering rules and the artifacts can never be
# byte-identical.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Show toolchain
        run: |
          swift --version
          clang --version

      # ------------------------------------------------------------------
      # 0) build the frozen seed, then the test harness WITH the seed
      # ------------------------------------------------------------------
      - name: "0. build frozen seed"
        run: swift build -c release --package-path compiler-reference

      # Trust boundary: the harness is built by the frozen reference, never by
      # the implementation under test.
      - name: "0. build test harness (with the seed)"
        run: |
          compiler-reference/.build/release/koralc build \
            --package-config tests/compiler-runner/koral.json \
            --target-module compiler_runner \
            -o bin/compiler-test-runner

      # ------------------------------------------------------------------
      # 1) seed self-check
      # ------------------------------------------------------------------
      - name: "1. seed self-check"
        run: |
          ./bin/compiler-test-runner/compiler_runner \
            --compiler swift \
            --swift-koralc compiler-reference/.build/release/koralc \
            --timeout 60 -j 4 \
            --report-file /tmp/1-seed.log

      # ------------------------------------------------------------------
      # 2-3) build bootstrap from the seed, then the main gate
      # ------------------------------------------------------------------
      - name: "2. seed -> stage1"
        run: |
          compiler-reference/.build/release/koralc build \
            --package-config compiler/koral.json \
            --target-module koralc \
            -o bin/compiler

      - name: "3. main gate"
        run: |
          ./bin/compiler-test-runner/compiler_runner \
            --compiler bootstrap \
            --bootstrap-koralc bin/compiler/koralc \
            --timeout 60 -j 4 \
            --report-file /tmp/3-bootstrap.log

      # ------------------------------------------------------------------
      # 4) self-host two rounds + fixed point + dangling scan
      # ------------------------------------------------------------------
      - name: "4. self-host + fixed point"
        run: |
          set -euo pipefail
          bin/compiler/koralc emit-c \
            --package-config compiler/koral.json --target-module koralc -o /tmp/s2
          clang /tmp/s2/koralc.c std/koral_runtime.c -I std -o /tmp/s2/koralc -Wno-everything -O1

          /tmp/s2/koralc emit-c \
            --package-config compiler/koral.json --target-module koralc -o /tmp/s3
          clang /tmp/s3/koralc.c std/koral_runtime.c -I std -o /tmp/s3/koralc -Wno-everything -O1

          /tmp/s3/koralc emit-c \
            --package-config compiler/koral.json --target-module koralc -o /tmp/s4

          cmp /tmp/s3/koralc.c /tmp/s4/koralc.c
          echo "FIXED POINT"

          # A line that is a bare `name();` is a declaration with no definition
          # -- the compiler emitted a call it never resolved.
          dangling=$(grep -cE '^[a-zA-Z_][a-zA-Z0-9_]*\(\);' /tmp/s3/koralc.c || true)
          echo "dangling=${dangling}"
          test "${dangling}" = "0"

      - name: "5. stage2 suite"
        run: |
          ./bin/compiler-test-runner/compiler_runner \
            --compiler bootstrap \
            --bootstrap-koralc /tmp/s2/koralc \
            --timeout 60 -j 4 \
            --report-file /tmp/5-stage2.log

      # ------------------------------------------------------------------
      # 6) the differential oracle
      #
      # Compiles and runs every case under BOTH compilers and requires them to
      # behave identically, diagnostic text included. A single-sided regression
      # -- one compiler drifting away from the other -- fails here even if each
      # still passes its own suite against the hand-written `// EXPECT` comments.
      # ------------------------------------------------------------------
      - name: "6. differential oracle"
        run: |
          ./bin/compiler-test-runner/compiler_runner \
            --compiler differential \
            --swift-koralc compiler-reference/.build/release/koralc \
            --bootstrap-koralc bin/compiler/koralc \
            --timeout 60 -j 4 \
            --report-file /tmp/6-differential.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: /tmp/*.log
          if-no-files-found: ignore
